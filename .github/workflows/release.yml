name: Release

# Tag pipelines re-run the quality gates on the tagged commit, build native
# binaries, and publish them with everything needed to check them: SHA-256
# checksums, an SBOM, SLSA provenance, a Sigstore signature, and attest's
# own signed receipt of the build.
#
# It would be odd for this project in particular to ship an unattested
# download.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One list of platforms, read by the gates and by the build. A binary is
  # published only for a platform whose test suite passed on that platform,
  # and a target cannot be added to the build without its gate, because
  # both jobs expand the same output. ci.yml carries the same list for pull
  # requests; keep the two identical.
  #
  # No Windows target: the private-key and connection-directory
  # permission hardening is `#[cfg(unix)]` with no Windows
  # equivalent, so a Windows build would write key material with
  # inherited ACLs. Adding the target means writing that code first.
  platforms:
    name: Platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - id: list
        run: |
          cat >> "$GITHUB_OUTPUT" <<'EOF'
          matrix=[{"os":"ubuntu-latest","name":"linux-x86_64"},{"os":"ubuntu-24.04-arm","name":"linux-aarch64"},{"os":"macos-15-intel","name":"macos-x86_64"},{"os":"macos-14","name":"macos-aarch64"}]
          EOF

  gates:
    name: gates (${{ matrix.name }})
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to match ci.yml: a tag must not fail on a lint that did not
      # exist when the commit was reviewed.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Formatting and lints do not depend on the platform; once is enough.
      - if: matrix.name == 'linux-x86_64'
        run: cargo fmt --all -- --check
      - if: matrix.name == 'linux-x86_64'
        run: cargo clippy --lib --bins --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: ${{ matrix.name }}
    needs: [platforms, gates]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned, like every other job that shapes a release artifact. A
      # floating channel would let two builds of the same tag use two
      # compilers and call both "the release".
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build
        run: cargo build --release --locked

      # What built this binary, next to the binary: compiler, target, and
      # the lock it was built from. Provenance that only says "this
      # workflow" leaves a recipient to guess at the inputs that shaped
      # the bytes.
      - name: Record the build inputs
        run: |
          set -euo pipefail
          INFO="attest-${GITHUB_REF_NAME}-${{ matrix.name }}.build-info.json"
          python3 - "$INFO" "${{ matrix.name }}" <<'PY'
          import json, hashlib, subprocess, sys
          info, name = sys.argv[1], sys.argv[2]
          rustc = subprocess.check_output(["rustc", "-vV"], text=True)
          fields = dict(line.split(": ", 1) for line in rustc.splitlines() if ": " in line)
          cargo = subprocess.check_output(["cargo", "-V"], text=True).strip()
          lock = hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest()
          json.dump({
              "platform": name,
              "rustc": {"release": fields.get("release"), "commit": fields.get("commit-hash"),
                        "host": fields.get("host"), "llvm": fields.get("LLVM version")},
              "cargo": cargo,
              "target": fields.get("host"),
              "profile": "release",
              "locked": True,
              "cargo_lock_sha256": lock,
              "source": {"ref": "${{ github.ref_name }}", "sha": "${{ github.sha }}"},
          }, open(info, "w"), indent=2, sort_keys=True)
          open(info, "a").write("\n")
          PY
          cat "$INFO"
          echo "info=$INFO" >> "$GITHUB_OUTPUT"
        id: info

      # The tarball has to be reproducible: rebuilding the same tag on the
      # same platform must yield the same bytes. Plain `tar -czf` bakes in the
      # file's mtime, the builder's uid/gid and a gzip timestamp, so two builds
      # of a byte-identical binary produced different checksums — which would
      # be an awkward property for this project in particular.
      #
      # GNU tar (Linux) and bsdtar (macOS) spell the ownership flags
      # differently. Each artifact is only ever produced by one of them, so
      # branching is enough; cross-implementation identity is neither
      # achievable nor needed, the binaries differ anyway.
      - name: Package
        id: package
        run: |
          set -euo pipefail
          PKG="attest-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"
          ./target/release/attest --version
          ( cd target/release
            TZ=UTC touch -t 202401010000.00 attest
            if tar --version 2>/dev/null | head -1 | grep -q GNU; then
              own="--owner=0 --group=0"
            else
              own="--uid 0 --gid 0"
            fi
            # shellcheck disable=SC2086
            tar --format=ustar $own --numeric-owner -cf - attest \
              | gzip -n -9 > "$GITHUB_WORKSPACE/$PKG" )
          shasum -a 256 "$PKG" > "$PKG.sha256"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ steps.package.outputs.pkg }}
            ${{ steps.package.outputs.pkg }}.sha256
            ${{ steps.info.outputs.info }}
          retention-days: 7

  # The source package that will go to crates.io, built and checked here,
  # from the reviewed lock, before anything is published anywhere: the
  # crate is a release subject like the binaries.
  crate:
    name: Source package
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Package from the locked graph
        run: cargo package --locked
      # The documented install path, run on the exact package, with the
      # exact lock a recipient gets: if `cargo install --locked` cannot
      # reproduce the graph, the release is not installable as documented.
      - name: Install the package the documented way
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          cargo install --locked --path "target/package/continuum-attest-${version}" --root "$RUNNER_TEMP/install"
          "$RUNNER_TEMP/install/bin/attest" --version
          cp "target/package/continuum-attest-${version}.crate" .
          echo "crate=continuum-attest-${version}.crate" >> "$GITHUB_OUTPUT"
        id: pkg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate
          path: ${{ steps.pkg.outputs.crate }}
          retention-days: 7

  attest-self:
    name: Attest the tagged build
    # The key lives in this environment, not in repository secrets. Only a
    # job that declares the environment can read it, which means a tag is the
    # only path to a signature -- and protection rules on the environment can
    # require a human to approve even that.
    environment: release
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo build --release --locked

      - name: Install signing key
        env:
          SIGNING_KEY: ${{ secrets.ATTEST_SIGNING_KEY }}
          KEY_ID: ${{ vars.ATTEST_KEY_ID }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "ATTEST_SIGNING_KEY is required for a release; refusing to ship unsigned." >&2
            exit 1
          fi
          mkdir -p .attest/keys
          printf '%s' "$SIGNING_KEY" | base64 -d > ".attest/keys/$KEY_ID.key"
          grep -q "BEGIN PRIVATE KEY" ".attest/keys/$KEY_ID.key"
          chmod 600 ".attest/keys/$KEY_ID.key"

      # --timestamp here and not in ci.yml. A release receipt is long-lived
      # evidence and is exactly what a timestamp is for; a pull request
      # receipt is not, and making every push depend on a third party's
      # uptime would trade a real cost for no benefit.
      - name: Run and verify the attested pipeline
        run: |
          ./target/release/attest run --verify --sign --timestamp \
            --key "${{ vars.ATTEST_KEY_ID }}"
          ./target/release/attest verify .attest/receipts/*.yaml \
            --recompute --trust-store .attest/trust --format text

      # include-hidden-files: `.attest/` is a dotted directory and the action
      # skips hidden paths by default, so the receipts silently never
      # uploaded. if-no-files-found: error, because a release whose evidence
      # is missing should fail rather than ship.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: receipts
          path: .attest/receipts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: SBOM
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: "1.98.1"
      # Version-pinned: the SBOM's shape is an input to the release, and a
      # tool that floats would change it between two runs of the same tag.
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Generate CycloneDX SBOM
        run: cargo cyclonedx --format json --all --override-filename attest-sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: attest-sbom.json
          retention-days: 7

  publish:
    name: Publish release
    needs: [build, crate, attest-self, sbom]
    runs-on: ubuntu-latest
    # Tags only. Without this, `workflow_dispatch` would try to publish a
    # release from a branch, so there would be no way to rehearse the whole
    # chain -- four platforms, attestation, SBOM, signing -- without creating
    # something. Dispatched runs now do everything except publish, which is
    # how you find out that a runner image disappeared or a secret was pasted
    # with a stray newline before a tag exists.
    if: startsWith(github.ref, 'refs/tags/v')
    # Configure this environment with a required reviewer: no release is
    # published without a human looking at the run first.
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # Sigstore keyless signing + build provenance
      attestations: write
    steps:
      # The release note is read from the repository, so this job needs the
      # tree like every other one. No credentials are kept: nothing here
      # pushes, and the token this job holds can write releases.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release
          find artifacts -name 'attest-*.tar.gz*' -exec cp {} release/ \;
          find artifacts -name 'attest-*.build-info.json' -exec cp {} release/ \;
          cp artifacts/crate/*.crate release/
          cp artifacts/sbom/attest-sbom.json release/
          # Not `|| true`: attest shipping a release with no receipt of its
          # own build is the one failure this project cannot paper over.
          cp artifacts/receipts/*.yaml release/
          # One combined checksum file, so a user can check everything with a
          # single `shasum -c`. Built from a sorted listing rather than globs:
          # a glob that matches nothing would otherwise fail the step, and the
          # order has to be stable for the file itself to be reproducible.
          ( cd release
            ls | grep -vE '\.sha256$|^SHA256SUMS$' | sort \
              | xargs shasum -a 256 > SHA256SUMS )
          ls -la release

      # GitHub-native build provenance: a signed SLSA attestation binding
      # each artifact digest to this workflow run.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release/*.tar.gz"

      - name: Sign artifacts with Sigstore (keyless)
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: release/*.tar.gz release/SHA256SUMS

      - name: Assemble the release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"

          # The release is named in the note's own first heading, so the
          # title and the text a reader sees come from one file.
          heading=$(head -1 .github/release-notes.md | sed 's/^# //')
          if [ -z "$heading" ]; then
            echo ".github/release-notes.md has no title line" >&2
            exit 1
          fi
          echo "title=$heading" >> "$GITHUB_OUTPUT"

          # The note lives in .github/release-notes.md so it can be read and
          # edited without touching this workflow. Only the version is
          # substituted; everything a reader sees was reviewed in a diff.
          # The title line is dropped from the body: GitHub shows it above.
          tail -n +2 .github/release-notes.md \
            | sed "s/__VERSION__/${version}/g" > release-notes.md
          echo "--- release notes ---"; head -40 release-notes.md

      - name: Create the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*
          name: ${{ steps.notes.outputs.title }}
          # The body is the reviewed note and nothing else. GitHub's generated
          # notes are a commit list; a reader wants to know what the release
          # does, not how it was assembled.
          generate_release_notes: false
          body_path: release-notes.md
