# Pin this action to an audited commit and the binary to its SHA256SUMS digest.
name: "attest wrap"
description: "Wrap an existing build, sign its receipt and publish offline release evidence"

inputs:
  version:
    description: "attest release version without v (0.3.1 or newer for the full evidence contract)"
    required: true
  sha256:
    description: "Pinned SHA-256 of attest-vVERSION-linux-x86_64.tar.gz"
    required: true
  step-name:
    description: "Step name recorded in the receipt"
    required: true
  command:
    description: "Build command, executed by sh -c"
    required: true
  inputs:
    description: "Whitespace-separated declared input paths; no glob expansion"
    default: ""
  outputs:
    description: "Whitespace-separated declared output paths; included in the evidence archive"
    default: ""
  key:
    description: "Local signing key ID; provision its store with ATTEST_KEYS_DIR"
    default: ""
  identity:
    description: "Also bind the receipt to GitHub OIDC with cosign v3; requires id-token: write"
    default: "false"
  evidence-policy:
    description: "required fails a successful build on evidence failure; optional reports the failure without failing it"
    default: "required"
  trust-store:
    description: "Independent public trust directory for verification (default WORKSPACE/.attest/trust)"
    default: ""
  identity-policy:
    description: "Optional independent recipient policy used to verify the produced archive"
    default: ""
  extra-args:
    description: "Additional wrap flags, shell-quoted if needed; signing is performed after the build"
    default: ""
  base-url:
    description: "HTTPS release store or internal mirror"
    default: "https://github.com/Alien6-Studio/continuum-attest/releases/download"

outputs:
  build-exit-code:
    description: "Wrapped command exit code, or empty when it did not start"
    value: ${{ steps.build.outputs.build-exit-code }}
  evidence-status:
    description: "produced or failed, independently of the build outcome"
    value: ${{ steps.build.outputs.evidence-status }}
  publication-status:
    description: "published, failed or skipped, from the actual upload outcome"
    value: ${{ steps.finish.outputs.publication-status }}
  status:
    description: "Final JSON status: build, evidence policy, production, verification, publication and errors"
    value: ${{ steps.finish.outputs.status }}
  build-status:
    description: "not_started, succeeded or failed"
    value: ${{ steps.finish.outputs.build-status }}
  evidence-policy:
    description: "required or optional"
    value: ${{ steps.finish.outputs.evidence-policy }}
  publication-url:
    description: "URL returned by the successful artifact upload"
    value: ${{ steps.finish.outputs.publication-url }}
  exit-code:
    description: "Final integration exit code after applying evidence policy"
    value: ${{ steps.finish.outputs.exit-code }}
  verification-status:
    description: "passed, failed or skipped"
    value: ${{ steps.finish.outputs.verification-status }}
  error-code:
    description: "Stable machine-readable failure code, empty on success"
    value: ${{ steps.finish.outputs.error-code }}
  failure-stage:
    description: "receipt, signing, timestamping, identity, packaging, verification, publication or reporting"
    value: ${{ steps.finish.outputs.failure-stage }}
  receipt:
    description: "Exact receipt path produced by this invocation"
    value: ${{ steps.build.outputs.receipt }}
  evidence:
    description: "Local path of the self-contained evidence archive"
    value: ${{ steps.build.outputs.evidence }}

runs:
  using: "composite"
  steps:
    - name: Install pinned attest binary
      shell: bash
      env:
        ATTEST_VERSION: ${{ inputs.version }}
        ATTEST_SHA256: ${{ inputs.sha256 }}
        ATTEST_BASE_URL: ${{ inputs.base-url }}
      run: |
        set -euo pipefail
        [[ "$(uname -s)/$(uname -m)" == "Linux/x86_64" ]] || { echo 'attest action requires Linux x86_64' >&2; exit 2; }
        [[ "$ATTEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]] || exit 2
        [[ "$ATTEST_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || exit 2
        install_dir="$(mktemp -d "$RUNNER_TEMP/attest-bin.XXXXXX")"
        package="attest-v${ATTEST_VERSION}-linux-x86_64.tar.gz"
        curl --proto '=https' --proto-redir '=https' --location --tlsv1.2 -fsSLo "$install_dir/$package" "${ATTEST_BASE_URL}/v${ATTEST_VERSION}/${package}"
        (cd "$install_dir" && printf '%s  %s\n' "$ATTEST_SHA256" "$package" | sha256sum -c -)
        tar -xzf "$install_dir/$package" -C "$install_dir" attest
        chmod +x "$install_dir/attest"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Build and produce evidence
      id: build
      shell: bash
      env:
        ATTEST_STEP_NAME: ${{ inputs.step-name }}
        ATTEST_COMMAND: ${{ inputs.command }}
        ATTEST_INPUTS: ${{ inputs.inputs }}
        ATTEST_OUTPUTS: ${{ inputs.outputs }}
        ATTEST_KEY: ${{ inputs.key }}
        ATTEST_IDENTITY: ${{ inputs.identity }}
        ATTEST_EXTRA_ARGS: ${{ inputs.extra-args }}
        ATTEST_EVIDENCE_POLICY: ${{ inputs.evidence-policy }}
        ATTEST_TRUST_STORE: ${{ inputs.trust-store }}
        ATTEST_IDENTITY_POLICY: ${{ inputs.identity-policy }}
      run: python3 "$GITHUB_ACTION_PATH/run.py"

    - name: Publish release evidence and build report
      id: publish
      if: ${{ !cancelled() && steps.build.outputs.evidence != '' }}
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: attest-evidence-${{ inputs.step-name }}
        path: ${{ steps.build.outputs.directory }}/
        include-hidden-files: true
        if-no-files-found: error

    - name: Report publication and restore build exit code
      id: finish
      if: ${{ !cancelled() }}
      shell: bash
      env:
        ATTEST_DIRECTORY: ${{ steps.build.outputs.directory }}
        ATTEST_EXIT_CODE: ${{ steps.build.outputs.exit-code }}
        ATTEST_BUILD_OUTCOME: ${{ steps.build.outcome }}
        ATTEST_PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        ATTEST_PUBLICATION_URL: ${{ steps.publish.outputs.artifact-url }}
      run: |
        python3 "$GITHUB_ACTION_PATH/run.py" --finalize \
          --directory "$ATTEST_DIRECTORY" \
          --publication-outcome "$ATTEST_PUBLISH_OUTCOME" \
          --build-outcome "$ATTEST_BUILD_OUTCOME"
