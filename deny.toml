# cargo-deny configuration.
#
# A tool whose subject is supply-chain integrity has to hold its own
# dependency graph to a stated standard. This file is that standard, and CI
# enforces it on every pull request.

[graph]
all-features = true

[advisories]
# Fail on any known vulnerability. There is no "accepted risk" list here on
# purpose: an entry in `ignore` must come with a comment saying why, who
# decided, and when it is revisited.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only, plus MPL-2.0 (file-level copyleft, which does
# not reach our source). Anything outside this list is a decision, not a
# default, and needs a line here with a reason.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots ships Mozilla's CA root store. CDLA-Permissive-2.0 is a data
  # licence, not a code one, which is why it appears here and nowhere else:
  # it grants unrestricted use of the data and imposes no downstream
  # obligation. Reviewed 2026-09-16; revisit if any crate other than
  # webpki-roots starts relying on it.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Nothing should pull in a second TLS stack: we build reqwest on rustls
# precisely to avoid an OpenSSL dependency to audit and ship.
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
]

[sources]
# Dependencies come from crates.io. A git dependency in a release build
# means an unpinned, unpublished input, which is the opposite of what this
# project claims to provide.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
