# Copy this file to .gitlab-ci.yml in a GitLab.com checkout of this repository.
# The OIDC declaration must be in the consuming project, not an included file.
# Runner prerequisite: Linux x86_64 with network-namespace creation permitted.
# No release key is used; the helper creates a disposable key after the build.
stages: [acceptance]

gitlab-identity-acceptance:
  stage: acceptance
  image: rust:1.98.1-bookworm
  id_tokens:
    ATTEST_CI_ID_TOKEN:
      aud: sigstore
  variables:
    TUF_ROOT: "$CI_PROJECT_DIR/.acceptance/tuf"
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 util-linux ca-certificates
  script:
    - |
      set -eu
      cargo build --locked
      mkdir -p .acceptance/bin
      curl --proto '=https' --proto-redir '=https' --location --tlsv1.2 -fsSLo .acceptance/bin/cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
      echo '424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  .acceptance/bin/cosign' | sha256sum -c -
      chmod +x .acceptance/bin/cosign
      export PATH="$CI_PROJECT_DIR/.acceptance/bin:$PATH"
      cosign initialize
      python3 - <<'PY'
      import os, pathlib, shutil
      roots = list(pathlib.Path(os.environ['TUF_ROOT']).rglob('*trusted_root.json'))
      assert len(roots) == 1
      shutil.copyfile(roots[0], '.acceptance/trusted-root.json')
      PY
      python3 tools/adoption-smoke.py target/debug/attest --provider gitlab \
        --identity-phase produce --state "$CI_PROJECT_DIR/.acceptance/identity" \
        --trusted-root "$CI_PROJECT_DIR/.acceptance/trusted-root.json"
      # Failing to create this namespace fails the test; it never falls back online.
      unshare --net -- python3 tools/adoption-smoke.py target/debug/attest --provider gitlab \
        --identity-phase verify --state "$CI_PROJECT_DIR/.acceptance/identity"
  artifacts:
    when: always
    paths:
      - .acceptance/identity/recipient/*.json
      - .acceptance/identity/delivery/release.attest.tar.zst
